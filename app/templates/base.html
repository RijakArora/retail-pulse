<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Retail-Pulse{% endblock %}</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; background: #f7f7f5; color: #222; margin: 0; }
  header { background: #1b1f27; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  header nav a { color: #cbd5e1; margin-left: 16px; font-weight: 400; font-size: 14px; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .card { background: #fff; border: 1px solid #e5e5e0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
  th { color: #555; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .badge-alert { background: #fde2e1; color: #9b1c1c; }
  .badge-stale { background: #fef3c7; color: #92400e; }
  form.simple { display: flex; flex-direction: column; gap: 10px; max-width: 360px; }
  input, button { padding: 9px 12px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; }
  button { background: #1b1f27; color: #fff; border: none; cursor: pointer; }
  .error { background: #fde2e1; color: #9b1c1c; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
  .ok { background: #dcfce7; color: #166534; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
  .muted { color: #888; font-size: 13px; }
</style>
</head>
<body>
<header>
  <a href="/">Retail-Pulse</a>
  <nav>
    {% if user %}
      <span class="muted" style="color:#cbd5e1;">{{ user.shop_name }}</span>
      <a href="/dashboard">Dashboard</a>
      <a href="/upload">Upload CSV</a>
      <a href="/logout">Log out</a>
    {% else %}
      <a href="/login">Log in</a>
      <a href="/signup">Sign up</a>
    {% endif %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
